server {
    listen 80;
    server_name _;

    # Increase body size for data imports
    client_max_body_size 50M;

    # Web Dashboard - serve at /app/
    # Next.js with basePath expects the full path including /app
    location /app {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket support for Next.js
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    
    # Handle /app without trailing slash
    location = /app {
        return 301 /app/;
    }

    # Next.js static assets - with basePath /app, files are at /app/_next/
    # proxy_pass without trailing slash preserves the full path
    location /app/_next/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache static assets
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Fallback for /_next/ (in case basePath is stripped)
    location /_next/ {
        proxy_pass http://web:3000/app/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache static assets
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js image optimization endpoint - with basePath /app
    location /app/_next/image {
        proxy_pass http://web:3000/app/_next/image;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Fallback for /_next/image
    location /_next/image {
        proxy_pass http://web:3000/app/_next/image;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public assets (images, fonts, etc.) - proxy to web service with /app prefix
    # With basePath /app, Next.js serves public assets at /app/filename
    location ~ ^/(favicon.ico|robots.txt|.*\.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot))$ {
        proxy_pass http://web:3000/app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache public assets
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    # Also handle public assets with /app prefix explicitly
    location ~ ^/app/(.*\.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)|favicon.ico|robots.txt)$ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache public assets
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check endpoints
    location /health {
        proxy_pass http://web:3000/app/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /collector/health {
        proxy_pass http://collector:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Collector API endpoints
    location /collector/ {
        proxy_pass http://collector:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS is handled by Fastify, don't add duplicate headers here
        # Fastify's @fastify/cors plugin will add the appropriate CORS headers
    }

    # Redirect common paths to /app/ prefix
    location ~ ^/(onboarding|login|register|sites|api|admin|invitations|orgs)(/.*)?$ {
        return 301 /app$request_uri;
    }

    # Redirect root to /app/
    location = / {
        return 301 /app/;
    }
}

